name: CI Database

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            database:
              - "database/**"
              - ".github/workflows/ci-database.yml"

  database-unit:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: database/go.mod
          cache-dependency-path: database/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  database-integration:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: database/go.mod
          cache-dependency-path: database/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  database-required:
    if: always()
    needs:
      - changes
      - database-unit
      - database-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "one or more required jobs failed" >&2
            exit 1
          fi
