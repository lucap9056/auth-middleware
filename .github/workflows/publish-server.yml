name: Publish Server

on:
  push:
    tags:
      - "server/v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish Server Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "${GITHUB_REF_NAME} points to a commit that is not on main" >&2
            exit 1
          fi

      - name: Resolve current tag
        id: tags
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME#server/}"
          NO_V="${CURRENT_TAG#v}"
          MAJOR_MINOR="${NO_V%.*}"
          {
            echo "current=${CURRENT_TAG}"
            echo "current_no_v=${NO_V}"
            echo "current_major_minor=v${MAJOR_MINOR}"
            echo "current_major_minor_no_v=${MAJOR_MINOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize registry owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/corvauth:${{ steps.tags.outputs.current }}
            ghcr.io/${{ steps.owner.outputs.name }}/corvauth:${{ steps.tags.outputs.current_no_v }}
            ghcr.io/${{ steps.owner.outputs.name }}/corvauth:${{ steps.tags.outputs.current_major_minor }}
            ghcr.io/${{ steps.owner.outputs.name }}/corvauth:${{ steps.tags.outputs.current_major_minor_no_v }}
            ghcr.io/${{ steps.owner.outputs.name }}/corvauth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
