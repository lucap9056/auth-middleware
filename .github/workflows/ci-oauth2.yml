name: CI OAuth2

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      oauth2: ${{ steps.filter.outputs.oauth2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            oauth2:
              - "oauth2/**"
              - ".github/workflows/ci-oauth2.yml"

  oauth2:
    needs: changes
    if: needs.changes.outputs.oauth2 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oauth2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: oauth2/go.mod
          cache-dependency-path: oauth2/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${{ github.event_name == 'pull_request' && '-race' || '' }} ./...

  oauth2-required:
    if: always()
    needs:
      - changes
      - oauth2
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "one or more required jobs failed" >&2
            exit 1
          fi
